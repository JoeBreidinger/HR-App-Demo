<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>HR APP</title>
  </head>
  <body>
    <h1>HR APP</h1>
    <table id="employee-table">
      <thead>
        <tr class="header-first-row">
          <th colspan="3">Current Employees</th>
        </tr>
        <tr>
          <th>Employee</th>
          <th>Position</th>
          <th>Salary</th>
        </tr>
      </thead>
      <tbody>
        <!-- dynamically placed by JS -->
      </tbody>
    </table>
    <br />
    <h2>Add an Employee Here</h2>
    <form id="add-employee">
      <label>Name: <input type="text" name="name" /> </label>
      <label>Position: <input type="text" name="position" /> </label>
      <label>Salary: <input type="text" name="salary" /> </label>
      <input type="submit" value="Add Employee" />
    </form>
    <script src="script.js"></script>
  </body>
</html>
